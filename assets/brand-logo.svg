<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">AF — Arya Fatthurahman monogram</title>
  <desc id="desc">Geometric AF monogram with a cyan to violet gradient on a dark rounded square.</desc>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1E293B" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="#0B0F17"/>
  <rect width="512" height="512" rx="112" fill="url(#grid)" opacity="0.45"/>
  <circle cx="256" cy="230" r="210" fill="url(#halo)"/>
  <circle cx="410" cy="420" r="130" fill="#22D3EE" opacity="0.10" filter="url(#soft)"/>

  <g fill="none" stroke="#334155" stroke-width="1.5" opacity="0.6">
    <path d="M96 140h48l20 20h40"/>
    <path d="M96 372h48l20-20h40"/>
    <path d="M416 140h-48l-20 20h-40"/>
    <path d="M416 372h-48l-20-20h-40"/>
  </g>
  <g fill="#22D3EE">
    <circle cx="96" cy="140" r="4"/>
    <circle cx="96" cy="372" r="4"/>
  </g>
  <g fill="#A855F7">
    <circle cx="416" cy="140" r="4"/>
    <circle cx="416" cy="372" r="4"/>
  </g>

  <rect x="116" y="116" width="280" height="280" rx="64" fill="#0F172A" stroke="url(#brand)" stroke-width="2.5"/>
  <path d="M148 196v-24a12 12 0 0 1 12-12h24" fill="none" stroke="#22D3EE" stroke-width="4" stroke-linecap="round"/>
  <path d="M364 316v24a12 12 0 0 1-12 12h-24" fill="none" stroke="#A855F7" stroke-width="4" stroke-linecap="round"/>

  <text x="256" y="302" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="132" font-weight="800" letter-spacing="-9" fill="url(#brand)">AF</text>

  <g>
    <circle cx="236" cy="330" r="5" fill="#22D3EE"/>
    <circle cx="256" cy="330" r="4" fill="#6366F1"/>
    <circle cx="276" cy="330" r="3" fill="#A855F7"/>
  </g>
</svg>
